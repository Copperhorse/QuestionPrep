[project]
name = "qp-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Ahmad Siddiqui", email = "copperhorse409120@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.71.0",
    "langchain-text-splitters>=1.1.0",
    "onnxruntime>=1.23.2",
    "openai>=2.16.0",
    "pydantic>=2.12.5",
    "pymupdf4llm>=0.2.9",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "sentence-transformers>=5.2.2",
    "tenacity>=9.1.2",
    "tiktoken>=0.12.0",
    "torch>=2.10.0",
    "qp-core",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
qp-core = { workspace = true }
