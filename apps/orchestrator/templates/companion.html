<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#c97f3e" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="StressCheck" />

        <title>StressCheck</title>
        <link rel="manifest" href="/static/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/styles.css" />

        <script src="/static/js/ort.min.js"></script>
        <script>
            if (window.ort) {
                ort.env.wasm.wasmPaths = "/static/js/";
                ort.env.wasm.numThreads = 1;
            }
        </script>
        <script src="/static/js/tcn-stress-detector.js"></script>
    </head>
    <body class="companion-body">
        <div class="companion-app">
            <header class="companion-header">
                <div class="companion-brand">
                    <svg
                        class="lucide icon-xl"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"
                        />
                    </svg>
                    <span>StressCheck</span>
                </div>
                <div class="companion-status" id="status-badge">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Initializing…</span>
                </div>
            </header>

            <div class="companion-visualizer" id="visualizer-container">
                <div class="companion-prompt" id="mic-prompt">
                    <svg
                        class="lucide icon-xl"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 19v3" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <rect x="9" y="2" width="6" height="12" rx="3" />
                    </svg>
                    <p>Tap the mic to start</p>
                </div>
            </div>

            <div class="companion-card" id="result-card" style="display: none">
                <div class="companion-card-header">
                    <svg
                        class="lucide"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"
                        />
                    </svg>
                    <span>Analysis Result</span>
                </div>
                <div class="companion-stress-level" id="stress-level">—</div>
                <div class="companion-stress-bar">
                    <div
                        class="companion-stress-fill"
                        id="stress-fill"
                        style="width: 0%"
                    ></div>
                </div>
                <div class="companion-metrics" id="stress-metrics"></div>
                <p class="companion-advice" id="stress-advice"></p>
            </div>

            <div class="companion-controls">
                <button
                    id="mic-btn"
                    class="btn btn-primary btn-lg companion-mic-btn"
                >
                    <svg
                        class="lucide"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 19v3" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <rect x="9" y="2" width="6" height="12" rx="3" />
                    </svg>
                    Start Listening
                </button>
                <button
                    id="stop-btn"
                    class="btn btn-danger btn-lg companion-mic-btn"
                    style="display: none"
                >
                    <svg
                        class="lucide"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                    </svg>
                    Stop
                </button>
            </div>

            <div
                class="companion-history"
                id="history-panel"
                style="display: none"
            >
                <h3 class="companion-history-title">
                    <svg
                        class="lucide"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                        />
                        <path d="M3 3v5h5" />
                    </svg>
                    Session History
                </h3>
                <div class="companion-history-list" id="history-list"></div>
            </div>

            <p class="companion-footer">
                Runs entirely on your device. No data leaves your phone.
            </p>
        </div>

        <script type="module">
            class MinimalAudioVisualizer {
                constructor(container, options = {}) {
                    this.container = container;
                    this._audioCtx = new (
                        window.AudioContext || window.webkitAudioContext
                    )();

                    this.canvas = document.createElement("canvas");
                    this.canvas.style.width = "100%";
                    this.canvas.style.height = "100%";
                    this.canvas.style.display = "none";
                    this.canvas.style.position = "absolute";
                    this.canvas.style.top = "0";
                    this.canvas.style.left = "0";
                    container.appendChild(this.canvas);

                    this.ctx = this.canvas.getContext("2d");
                    this.resize();

                    this._ro = new ResizeObserver(() => this.resize());
                    this._ro.observe(container);

                    this.analyser = null;
                    this.source = null;
                    this.rafId = null;

                    this.minDecibels = options.minDecibels ?? -75;
                    this.smoothing = options.smoothing ?? 0.8;
                }

                get audioCtx() {
                    return this._audioCtx;
                }

                resize() {
                    const rect = this.container.getBoundingClientRect();
                    const dpr = window.devicePixelRatio || 1;
                    this.canvas.width = rect.width * dpr;
                    this.canvas.height = rect.height * dpr;
                    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    this.width = rect.width;
                    this.height = rect.height;
                }

                // API-compatibility stubs for the original library
                registerGradient(name, opts) {}
                setOptions(opts) {}
                disconnectOutput() {}

                connectInput(sourceNode) {
                    this.source = sourceNode;
                    this.analyser = this._audioCtx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.analyser.smoothingTimeConstant = this.smoothing;
                    this.analyser.minDecibels = this.minDecibels;
                    this.analyser.maxDecibels = -10;
                    sourceNode.connect(this.analyser);

                    this.canvas.style.display = "block";
                    this.draw();
                }

                disconnectInput() {
                    this.canvas.style.display = "none";
                    if (this.rafId) {
                        cancelAnimationFrame(this.rafId);
                        this.rafId = null;
                    }
                    if (this.source && this.analyser) {
                        try {
                            this.source.disconnect(this.analyser);
                        } catch (e) {}
                    }
                    if (this.analyser) {
                        try {
                            this.analyser.disconnect();
                        } catch (e) {}
                    }
                    this.analyser = null;
                    this.source = null;
                }

                draw() {
                    if (!this.analyser) return;

                    const bufferLength = this.analyser.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    this.analyser.getByteFrequencyData(dataArray);

                    const ctx = this.ctx;
                    const w = this.width;
                    const h = this.height;

                    ctx.clearRect(0, 0, w, h);

                    const barCount = 32;
                    const step = Math.floor(bufferLength / barCount);
                    const gapRatio = 0.35;
                    const barWidth = (w / barCount) * (1 - gapRatio);
                    const gap = (w / barCount) * gapRatio;

                    for (let i = 0; i < barCount; i++) {
                        let sum = 0;
                        const start = i * step;
                        const end = Math.min(start + step, bufferLength);
                        for (let j = start; j < end; j++) sum += dataArray[j];
                        const avg = sum / (end - start);
                        const pct = avg / 255;
                        const barHeight = Math.max(2, pct * h * 0.9);

                        const x = i * (barWidth + gap) + gap / 2;
                        const y = h - barHeight;

                        // Warm gradient matching the app theme (#b1682e → #c97f3e → #dfa56f)
                        let r, g, b;
                        if (pct < 0.5) {
                            const t = pct * 2;
                            r = 177 + (201 - 177) * t;
                            g = 104 + (127 - 104) * t;
                            b = 46 + (62 - 46) * t;
                        } else {
                            const t = (pct - 0.5) * 2;
                            r = 201 + (223 - 201) * t;
                            g = 127 + (165 - 127) * t;
                            b = 62 + (111 - 62) * t;
                        }

                        ctx.fillStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
                        ctx.fillRect(x, y, barWidth, barHeight);
                    }

                    this.rafId = requestAnimationFrame(() => this.draw());
                }
            }
            console.log(
                "Module script executing. window.TcnStressDetector =",
                typeof window.TcnStressDetector,
            );

            const visualizerContainer = document.getElementById(
                "visualizer-container",
            );
            const micPrompt = document.getElementById("mic-prompt");
            const micBtn = document.getElementById("mic-btn");
            const stopBtn = document.getElementById("stop-btn");
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");
            const resultCard = document.getElementById("result-card");
            const stressLevelEl = document.getElementById("stress-level");
            const stressFill = document.getElementById("stress-fill");
            const stressMetrics = document.getElementById("stress-metrics");
            const stressAdvice = document.getElementById("stress-advice");
            const historyPanel = document.getElementById("history-panel");
            const historyList = document.getElementById("history-list");

            let detector = null;
            let audioMotion = null;
            let micStream = null;
            let sessionHistory = [];
            let isRecording = false;

            const ADVICE = {
                not_stressed: "You're sounding calm and composed. Great job!",
                mild: "A slight tension detected. Try a slow breath in… and out.",
                stressed:
                    "Stress signals present. Pause, breathe, reset your pace.",
                highly_stressed:
                    "High stress detected. Take a 30-second break before continuing.",
            };

            const LEVEL_LABELS = {
                not_stressed: "Calm",
                mild: "Mild Tension",
                stressed: "Stressed",
                highly_stressed: "High Stress",
            };

            const LEVEL_COLORS = {
                not_stressed: "#6a9e76",
                mild: "#c99a3e",
                stressed: "#c97f3e",
                highly_stressed: "#c95a4e",
            };

            async function initDetector() {
                if (!window.TcnStressDetector) {
                    const msg =
                        "TCN library not loaded. Check console for script parse errors.";
                    setStatus("error", msg);
                    console.error(
                        "window.TcnStressDetector is undefined. Verify tcn-stress-detector.js loaded without syntax errors.",
                    );
                    return false;
                }
                // 5-second windows, non-overlapping (result every 5s).
                // Change overlapSeconds to 4 if you want a result every 1s.
                detector = new window.TcnStressDetector({
                    modelPath: "/static/models/tcn_audio_model.onnx",
                    wasmDir: "/static/js/",
                    workerPath: "/static/js/tcn-worker.js",
                    clipSeconds: 5,
                    overlapSeconds: 0,
                    targetSR: 16000,
                });
                try {
                    setStatus("loading", "Loading TCN model…");
                    await detector.init();
                    setStatus("ready", "Ready — tap mic to start");
                    return true;
                } catch (err) {
                    console.error(err);
                    setStatus("error", `Model failed to load: ${err.message}`);
                    return false;
                }
            }

            function setStatus(state, text) {
                statusText.textContent = text;
                statusDot.className = "status-dot";
                if (state === "ready") statusDot.classList.add("ready");
                else if (state === "loading")
                    statusDot.classList.add("loading");
                else if (state === "error") statusDot.classList.add("error");
                else if (state === "recording")
                    statusDot.classList.add("recording");
                else if (state === "analyzing")
                    statusDot.classList.add("analyzing");
            }

            function initVisualizer() {
                if (audioMotion) return;
                audioMotion = new MinimalAudioVisualizer(visualizerContainer, {
                    height: 200,
                    minDecibels: -75,
                    smoothing: 0.8,
                });
            }

            function triggerHaptics(level) {
                if (!navigator.vibrate) return;

                const patterns = {
                    not_stressed: [],
                    mild: [100],
                    stressed: [200, 100, 200],
                    highly_stressed: [300, 100, 300, 100, 300],
                };

                const pattern = patterns[level];
                if (pattern && pattern.length > 0) {
                    navigator.vibrate(pattern);
                }
            }

            async function startRecording() {
                if (isRecording) return;
                if (!detector?._ready) {
                    alert("Model not ready yet. Please wait.");
                    return;
                }

                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            sampleRate: 16000,
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                        },
                        video: false,
                    });

                    initVisualizer();
                    const micNode =
                        audioMotion.audioCtx.createMediaStreamSource(micStream);
                    audioMotion.connectInput(micNode);

                    // Real-time callback: fires every 5 seconds (clipSeconds)
                    detector.onResult = (result) => {
                        showResult(result);
                        addToHistory(result);
                        triggerHaptics(result.stressLevel);
                    };

                    await detector.startListening(micStream);

                    isRecording = true;
                    micPrompt.style.display = "none";
                    micBtn.style.display = "none";
                    stopBtn.style.display = "flex";
                    setStatus("recording", "Listening… analyzing every 5s");
                    resultCard.style.display = "none";
                } catch (err) {
                    console.error(err);
                    alert("Microphone access denied or failed: " + err.message);
                }
            }

            function stopRecording() {
                detector.onResult = null;
                detector.stopListening();

                audioMotion?.disconnectInput();

                micStream = null;
                isRecording = false;
                micPrompt.style.display = "flex";
                micBtn.style.display = "flex";
                stopBtn.style.display = "none";
                setStatus("ready", "Ready — tap mic to start");
            }

            function showResult(result) {
                const level = result.stressLevel;
                const prob = result.stressProb;
                const color = LEVEL_COLORS[level];

                stressLevelEl.textContent = LEVEL_LABELS[level];
                stressLevelEl.style.color = color;
                stressFill.style.width = `${Math.round(prob * 100)}%`;
                stressFill.style.background = color;
                stressAdvice.textContent = ADVICE[level];

                stressMetrics.innerHTML = `
                <span class="companion-metric"><strong>${(prob * 100).toFixed(0)}%</strong> stress probability</span>
                <span class="companion-metric"><strong>${result.emotion}</strong> detected emotion</span>
                <span class="companion-metric"><strong>${result.processingMs}ms</strong> on-device</span>
            `;

                resultCard.style.display = "block";
                resultCard.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest",
                });
            }

            function addToHistory(result) {
                sessionHistory.unshift({
                    time: new Date().toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit",
                    }),
                    level: result.stressLevel,
                    prob: result.stressProb,
                    emotion: result.emotion,
                });
                renderHistory();
            }

            function renderHistory() {
                if (sessionHistory.length === 0) return;
                historyPanel.style.display = "block";
                historyList.innerHTML = sessionHistory
                    .map(
                        (h, i) => `
                <div class="companion-history-item" style="--item-color: ${LEVEL_COLORS[h.level]}">
                    <span class="history-time">${h.time}</span>
                    <span class="history-level">${LEVEL_LABELS[h.level]}</span>
                    <span class="history-prob">${(h.prob * 100).toFixed(0)}%</span>
                    <span class="history-emotion">${h.emotion}</span>
                </div>
            `,
                    )
                    .join("");
            }

            micBtn.addEventListener("click", startRecording);
            stopBtn.addEventListener("click", stopRecording);

            initDetector();
        </script>

        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker
                    .register("/sw.js")
                    .then((reg) => console.log("SW registered:", reg.scope))
                    .catch((err) => console.error("SW failed:", err));
            }
        </script>
    </body>
</html>
