<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interview Session - QuestionPrep</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/styles.css" />

        <!-- ONNX Runtime — load before stress detector -->
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

        <style>
            #stress-banner {
                display: none;
                max-width: 800px;
                margin: 12px auto 0;
                padding: 12px 20px;
                border-radius: 12px;
                font-size: 14px;
                font-weight: 600;
                text-align: center;
                transition: all 0.3s ease;
            }
            #stress-banner.not_stressed {
                background: #d1fae5;
                color: #065f46;
                border: 1px solid #6ee7b7;
            }
            #stress-banner.mild {
                background: #fef9c3;
                color: #713f12;
                border: 1px solid #fde047;
            }
            #stress-banner.stressed {
                background: #ffedd5;
                color: #9a3412;
                border: 1px solid #fdba74;
            }
            #stress-banner.highly_stressed {
                background: #fee2e2;
                color: #991b1b;
                border: 1px solid #fca5a5;
            }
            #stress-banner.analyzing {
                background: #f3f4f6;
                color: #6b7280;
                border: 1px solid #d1d5db;
            }

            #stress-details {
                display: none;
                max-width: 800px;
                margin: 8px auto 0;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .stress-pill {
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 20px;
                background: rgba(0, 0, 0, 0.06);
                color: #374151;
            }
        </style>
    </head>
    <body style="background-color: var(--pink-mist)">
        <section style="padding: 40px 0">
            <div class="container">
                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 20px;
                    "
                >
                    <h2 style="margin: 0; text-align: left">
                        Live Practice Session
                    </h2>
                    <button
                        class="cta-button"
                        style="
                            background-color: var(--pastel-rose);
                            border: none;
                            padding: 10px 20px;
                        "
                    >
                        End Session
                    </button>
                </div>

                <div class="chat-container">
                    <div class="message msg-ai">
                        <strong>Interviewer:</strong><br />
                        Can you explain the difference between a process and a
                        thread in an operating system?
                    </div>
                </div>

                <div style="max-width: 800px; margin: 0 auto">
                    <div class="visualizer-wrapper" id="visualizer-container">
                        <span class="visualizer-prompt" id="mic-prompt"
                            >Click "Start Mic" to speak</span
                        >
                    </div>
                </div>

                <div style="max-width: 800px; margin: 0 auto">
                    <form class="input-area" id="chat-form">
                        <button
                            type="button"
                            id="mic-btn"
                            class="cta-button"
                            style="
                                background-color: var(--soft-lime);
                                color: var(--soft-charcoal);
                                border: none;
                                cursor: pointer;
                            "
                        >
                            🎙️ Start Mic
                        </button>
                        <textarea
                            class="form-control"
                            id="answer-text"
                            rows="2"
                            placeholder="Type your answer or speak..."
                            style="resize: none"
                        ></textarea>
                        <button
                            type="submit"
                            class="cta-button"
                            style="
                                border: none;
                                cursor: pointer;
                                padding: 0 40px;
                            "
                        >
                            Send
                        </button>
                    </form>
                </div>
            </div>

            <!-- Stress indicator — shown after mic stops -->
            <div id="stress-banner"></div>
            <div id="stress-details"></div>

            <div style="max-width: 800px; margin: 12px auto 0">
                <audio
                    id="audio-playback"
                    controls
                    style="
                        display: none;
                        width: 100%;
                        border-radius: 20px;
                        outline: none;
                    "
                ></audio>
            </div>
        </section>

        <!-- Stress detector — loaded as a plain script so window.StressDetector is available -->
        <script src="/static/js/stress-detector.js"></script>

        <script type="module">
            import AudioMotionAnalyzer from "https://unpkg.com/audiomotion-analyzer?module";

            // ── DOM refs ──────────────────────────────────────────────────────
            const container = document.getElementById("visualizer-container");
            const micBtn = document.getElementById("mic-btn");
            const micPrompt = document.getElementById("mic-prompt");
            const audioPlayback = document.getElementById("audio-playback");
            const stressBanner = document.getElementById("stress-banner");
            const stressDetails = document.getElementById("stress-details");
            const answerText = document.getElementById("answer-text");

            // ── State ─────────────────────────────────────────────────────────
            let audioMotion = null;
            let micStream = null;
            let mediaRecorder = null;
            let audioChunks = [];

            // ── Stress detector — initialise once, load models in background ──
            let detector = null;

            if (window.StressDetector) {
                detector = new window.StressDetector({
                    xgboost: "/static/models/xgboost.onnx",
                    randomForest: "/static/models/random_forest.onnx",
                    logisticRegression:
                        "/static/models/logistic_regression.onnx",
                });
                detector.load().catch((err) => {
                    console.warn(
                        "[StressDetector] Model load failed — stress analysis disabled.",
                        err,
                    );
                    detector = null;
                });
            } else {
                console.warn(
                    "[StressDetector] stress-detector.js not loaded — stress analysis disabled.",
                );
            }

            // ── Visualizer ────────────────────────────────────────────────────
            function initVisualizer() {
                audioMotion = new AudioMotionAnalyzer(container, {
                    source: null,
                    height: 120,
                    mode: 3,
                    barSpace: 0.4,
                    ledBars: false,
                    lumiBars: false,
                    radial: false,
                    showScaleX: false,
                    showScaleY: false,
                    bgAlpha: 0,
                    overlay: true,
                    gradient: "classic",
                    minDecibels: -70,
                    smoothing: 0.7,
                });
                audioMotion.registerGradient("pastel", {
                    bgColor: "transparent",
                    colorStops: [
                        { pos: 0, color: "#93C5FD" },
                        { pos: 0.5, color: "#C7D2FE" },
                        { pos: 1, color: "#FBCFE8" },
                    ],
                });
                audioMotion.setOptions({ gradient: "pastel" });
                audioMotion.disconnectOutput();
            }

            // ── Stress UI ─────────────────────────────────────────────────────
            const STRESS_MESSAGES = {
                not_stressed: "✅ You sound calm and composed. Great job!",
                mild: "💛 Slight hesitation detected. Take a breath before answering.",
                stressed:
                    "⚠️ You sound stressed. Try slowing down and speaking clearly.",
                highly_stressed:
                    "🔴 High stress detected. Pause, breathe, and speak at a steady pace.",
                analyzing: "⏳ Analysing your response...",
            };

            function showStressBanner(level, details = null) {
                stressBanner.className = level;
                stressBanner.textContent = STRESS_MESSAGES[level] || level;
                stressBanner.style.display = "block";

                if (details && level !== "analyzing") {
                    stressDetails.innerHTML = `
                        <span class="stress-pill">Probability: ${(details.probability * 100).toFixed(0)}%</span>
                        <span class="stress-pill">XGB: ${(details.modelScores.xgboost * 100).toFixed(0)}%</span>
                        <span class="stress-pill">RF: ${(details.modelScores.randomForest * 100).toFixed(0)}%</span>
                        <span class="stress-pill">LR: ${(details.modelScores.logisticRegression * 100).toFixed(0)}%</span>
                        ${details.stutterFlag ? '<span class="stress-pill">🔁 Disfluency detected</span>' : ""}
                    `;
                    stressDetails.style.display = "flex";
                } else {
                    stressDetails.style.display = "none";
                }
            }

            function hideStressBanner() {
                stressBanner.style.display = "none";
                stressDetails.style.display = "none";
            }

            // ── Decode webm blob → Float32Array at 16kHz ──────────────────────
            async function blobToFloat32(blob) {
                const arrayBuffer = await blob.arrayBuffer();
                const audioCtx = new AudioContext({ sampleRate: 16000 });
                const decoded = await audioCtx.decodeAudioData(arrayBuffer);
                await audioCtx.close();
                return decoded.getChannelData(0);
            }

            // ── Send to server for STT + disfluency analysis ──────────────────
            async function analyzeOnServer(blob) {
                try {
                    const formData = new FormData();
                    formData.append("audio", blob, "recording.webm");
                    const res = await fetch("/api/analyze-speech", {
                        method: "POST",
                        body: formData,
                    });
                    if (!res.ok) throw new Error(`Server error ${res.status}`);
                    return await res.json();
                    // Expected: { transcript, stutter_flag, disfluency_rate }
                } catch (err) {
                    console.warn("[Server STT] Failed:", err);
                    return { stutter_flag: false, transcript: "" };
                }
            }

            // ── Main analysis pipeline ────────────────────────────────────────
            async function runAnalysis(audioBlob) {
                // If detector didn't load, skip silently
                if (!detector) return;

                showStressBanner("analyzing");

                try {
                    // Client-side audio decode + server STT run in parallel
                    const [float32Audio, serverResult] = await Promise.all([
                        blobToFloat32(audioBlob),
                        analyzeOnServer(audioBlob),
                    ]);

                    // Populate transcript into textarea
                    if (serverResult.transcript) {
                        answerText.value = serverResult.transcript;
                    }

                    // Run ONNX stress detection
                    const stressResult = await detector.predict(
                        float32Audio,
                        serverResult.stutter_flag || false,
                    );

                    showStressBanner(stressResult.level, {
                        probability: stressResult.probability,
                        modelScores: stressResult.modelScores,
                        stutterFlag: serverResult.stutter_flag,
                    });
                } catch (err) {
                    console.error("[Analysis] Failed:", err);
                    hideStressBanner();
                }
            }

            // ── Mic button ────────────────────────────────────────────────────
            micBtn.addEventListener("click", async () => {
                if (!audioMotion) initVisualizer();

                // TOGGLE MIC OFF
                if (micStream) {
                    if (mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }
                    micStream.getTracks().forEach((track) => track.stop());
                    audioMotion.disconnectInput();
                    micStream = null;

                    micBtn.innerText = "🎙️ Start Mic";
                    micBtn.style.backgroundColor = "var(--soft-lime)";
                    micPrompt.style.display = "block";
                    return;
                }

                // TOGGLE MIC ON
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            noiseSuppression: true,
                            echoCancellation: true,
                            autoGainControl: false,
                        },
                        video: false,
                    });

                    const micNode =
                        audioMotion.audioCtx.createMediaStreamSource(micStream);
                    audioMotion.connectInput(micNode);

                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(micStream);

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, {
                            type: "audio/webm",
                        });

                        audioPlayback.src = URL.createObjectURL(audioBlob);
                        audioPlayback.style.display = "block";

                        // Run stress analysis pipeline
                        await runAnalysis(audioBlob);
                    };

                    mediaRecorder.start();
                    audioPlayback.style.display = "none";
                    hideStressBanner();

                    micBtn.innerText = "🛑 Stop Mic";
                    micBtn.style.backgroundColor = "var(--pastel-rose)";
                    micPrompt.style.display = "none";
                } catch (err) {
                    console.error("Microphone access denied or failed:", err);
                    alert(
                        "Could not access microphone. Please check your browser permissions.",
                    );
                }
            });
        </script>
    </body>
</html>
