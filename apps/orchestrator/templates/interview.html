<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interview Session — QuestionPrep</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/styles.css" />

        <script src="/static/js/ort.min.js"></script>
        <script>
            if (window.ort) {
                ort.env.wasm.wasmPaths = "/static/js/";
                ort.env.wasm.numThreads = 1;
            }
        </script>
        <script src="/static/js/tcn-stress-detector.js"></script>
    </head>
    <body>
        <nav class="site-nav">
            <div class="container">
                <a href="/" class="nav-brand">QuestionPrep</a>
                <div class="nav-links">
                    <span class="nav-live-badge">Live Practice Session</span>
                    <button id="end-session-btn" class="btn btn-outline btn-sm">
                        <svg
                            class="lucide"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="10" />
                            <path d="m15 9-6 6" />
                            <path d="m9 9 6 6" />
                        </svg>
                        End Session
                    </button>
                </div>
            </div>
        </nav>

        <section class="page-section">
            <div class="container container-narrow">
                <div class="page-header interview-header">
                    <h1>Live Practice Session</h1>
                    <p class="page-subtitle">
                        Take your time. Speak clearly. There is no rush here.
                    </p>
                </div>

                <div class="chat-container" id="chat-window">
                    <div class="chat-placeholder">Connecting to session…</div>
                </div>

                <div id="stress-banner"></div>
                <div id="stress-details"></div>

                <div class="visualizer-wrapper" id="visualizer-container">
                    <span class="visualizer-prompt" id="mic-prompt"
                        >Click "Start Mic" to speak</span
                    >
                </div>

                <audio
                    id="audio-playback"
                    class="interview-audio"
                    controls
                ></audio>

                <div class="input-area interview-input-area">
                    <button type="button" id="mic-btn" class="btn btn-success">
                        <svg
                            class="lucide"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M12 19v3" />
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                            <rect x="9" y="2" width="6" height="12" rx="3" />
                        </svg>
                        Start Mic
                    </button>
                    <textarea
                        class="form-control"
                        id="answer-text"
                        rows="2"
                        placeholder="Type your answer or speak…"
                    ></textarea>
                    <form id="chat-form" class="interview-send-form">
                        <button
                            type="submit"
                            class="btn btn-primary interview-send-btn"
                        >
                            <svg
                                class="lucide"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="m22 2-7 20-4-9-9-4Z" />
                                <path d="M22 2 11 13" />
                            </svg>
                            Send
                        </button>
                    </form>
                </div>

                <p class="interview-hint">
                    Your answers are saved automatically. You can end the
                    session at any time.
                </p>
            </div>
        </section>

        <script src="/static/js/interview.js"></script>

        <script type="module">
            import AudioMotionAnalyzer from "https://unpkg.com/audiomotion-analyzer?module";

            const container = document.getElementById("visualizer-container");
            const micBtn = document.getElementById("mic-btn");
            const micPrompt = document.getElementById("mic-prompt");
            const audioPlay = document.getElementById("audio-playback");
            const stressBanner = document.getElementById("stress-banner");
            const stressDetails = document.getElementById("stress-details");
            const answerText = document.getElementById("answer-text");

            let audioMotion = null;
            let micStream = null;
            let mediaRecorder = null;
            let audioChunks = [];

            const PREFERRED_MIME_TYPES = [
                "audio/webm;codecs=opus",
                "audio/webm",
                "audio/ogg;codecs=opus",
                "audio/ogg",
            ];
            const RECORDER_MIME_TYPE =
                PREFERRED_MIME_TYPES.find((t) =>
                    MediaRecorder.isTypeSupported(t),
                ) ?? "";

            let detector = null;
            if (window.TcnStressDetector) {
                detector = new window.TcnStressDetector({
                    modelPath: "/static/models/tcn_audio_model.onnx",
                    wasmDir: "/static/js/",
                    workerPath: "/static/js/tcn-worker.js",
                });
                detector.init().catch((err) => {
                    console.error(
                        "[TcnStressDetector] Model load FAILED:",
                        err,
                    );
                    detector = null;
                    stressBanner.textContent =
                        "Stress analysis unavailable — TCN model could not be loaded.";
                    stressBanner.className = "unavailable";
                    stressBanner.style.display = "block";
                });
            } else {
                console.error(
                    "TcnStressDetector not found on window. Check that tcn-stress-detector.js loaded without syntax errors.",
                );
                stressBanner.textContent =
                    "Stress analysis unavailable — detector library failed to load.";
                stressBanner.className = "unavailable";
                stressBanner.style.display = "block";
            }

            function initVisualizer() {
                audioMotion = new AudioMotionAnalyzer(container, {
                    source: null,
                    height: 120,
                    mode: 3,
                    barSpace: 0.4,
                    ledBars: false,
                    lumiBars: false,
                    radial: false,
                    showScaleX: false,
                    showScaleY: false,
                    bgAlpha: 0,
                    overlay: true,
                    gradient: "classic",
                    minDecibels: -70,
                    smoothing: 0.7,
                });
                audioMotion.registerGradient("warm", {
                    bgColor: "transparent",
                    colorStops: [
                        { pos: 0, color: "#b1682e" },
                        { pos: 0.5, color: "#c97f3e" },
                        { pos: 1, color: "#dfa56f" },
                    ],
                });
                audioMotion.setOptions({ gradient: "warm" });
                audioMotion.disconnectOutput();
            }

            const STRESS_MESSAGES = {
                not_stressed: "You sound calm and composed. Keep going.",
                mild: "Slight hesitation detected. Take a breath before continuing.",
                stressed:
                    "You sound a little stressed. Try slowing down and speaking clearly.",
                highly_stressed:
                    "High stress detected. Pause, breathe, and speak at a steady pace.",
                analyzing: "Analysing your response…",
                unavailable: "Stress analysis is currently unavailable.",
            };

            function showStressBanner(level, details = null) {
                stressBanner.className = level;
                stressBanner.textContent = STRESS_MESSAGES[level] || level;
                stressBanner.style.display = "block";
                if (details && level !== "analyzing") {
                    const pills = [
                        `<span class="stress-pill">Stress: ${(details.probability * 100).toFixed(0)}%</span>`,
                        `<span class="stress-pill">Emotion: ${details.emotion || "unknown"}</span>`,
                    ];
                    if (details.stutterFlag)
                        pills.push(
                            '<span class="stress-pill">Disfluency detected</span>',
                        );
                    if (details.processingMs)
                        pills.push(
                            `<span class="stress-pill">${details.processingMs}ms</span>`,
                        );
                    stressDetails.innerHTML = pills.join("");
                    stressDetails.style.display = "flex";
                } else {
                    stressDetails.style.display = "none";
                }
            }

            function hideStressBanner() {
                stressBanner.style.display = "none";
                stressDetails.style.display = "none";
            }

            async function blobToFloat32(blob) {
                const arrayBuffer = await blob.arrayBuffer();
                const audioCtx = new AudioContext({ sampleRate: 16000 });
                const decoded = await audioCtx.decodeAudioData(arrayBuffer);
                await audioCtx.close();
                return decoded.getChannelData(0);
            }

            async function analyzeOnServer(blob) {
                try {
                    const formData = new FormData();
                    formData.append("audio", blob, "recording.webm");
                    const res = await fetch("/api/analyze-speech", {
                        method: "POST",
                        body: formData,
                    });
                    if (!res.ok) throw new Error(`Server error ${res.status}`);
                    return await res.json();
                } catch (err) {
                    console.warn("[Server STT] Failed:", err);
                    return { stutter_flag: false, transcript: "" };
                }
            }

            async function runAnalysis(audioBlob) {
                showStressBanner("analyzing");
                try {
                    const sttPromise = analyzeOnServer(audioBlob);
                    const audioPromise = blobToFloat32(audioBlob);
                    const readyPromise = detector
                        ? detector.waitUntilReady().catch(() => {
                              detector = null;
                          })
                        : Promise.resolve();

                    const [serverResult, float32Audio] = await Promise.all([
                        sttPromise,
                        audioPromise,
                        readyPromise,
                    ]);

                    if (serverResult.transcript)
                        answerText.value = serverResult.transcript;
                    if (!detector) {
                        if (stressBanner.className !== "unavailable")
                            hideStressBanner();
                        return;
                    }
                    detector.setDisfluencyFlag(
                        serverResult.stutter_flag || false,
                    );
                    const stressResult =
                        await detector.analyseClip(float32Audio);
                    showStressBanner(stressResult.stressLevel, {
                        probability: stressResult.stressProb,
                        emotion: stressResult.emotion,
                        processingMs: stressResult.processingMs,
                        stutterFlag: serverResult.stutter_flag,
                    });
                } catch (err) {
                    console.error("[Analysis] Failed:", err);
                    hideStressBanner();
                }
            }

            micBtn.addEventListener("click", async () => {
                if (!audioMotion) initVisualizer();
                if (micStream) {
                    if (mediaRecorder?.state !== "inactive")
                        mediaRecorder.stop();
                    micStream.getTracks().forEach((t) => t.stop());
                    audioMotion.disconnectInput();
                    micStream = null;
                    micBtn.innerHTML =
                        '<svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="12" rx="3"/></svg> Start Mic';
                    micBtn.className = "btn btn-success";
                    micPrompt.style.display = "block";
                    return;
                }
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            noiseSuppression: true,
                            echoCancellation: true,
                            autoGainControl: false,
                        },
                        video: false,
                    });
                    const micNode =
                        audioMotion.audioCtx.createMediaStreamSource(micStream);
                    audioMotion.connectInput(micNode);
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(
                        micStream,
                        RECORDER_MIME_TYPE
                            ? { mimeType: RECORDER_MIME_TYPE }
                            : {},
                    );
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };
                    mediaRecorder.onstop = async () => {
                        const blobType = RECORDER_MIME_TYPE || "audio/webm";
                        const audioBlob = new Blob(audioChunks, {
                            type: blobType,
                        });
                        audioPlay.src = URL.createObjectURL(audioBlob);
                        audioPlay.style.display = "block";
                        await runAnalysis(audioBlob);
                    };
                    mediaRecorder.start();
                    audioPlay.style.display = "none";
                    hideStressBanner();
                    micBtn.innerHTML =
                        '<svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg> Stop Mic';
                    micBtn.className = "btn btn-danger";
                    micPrompt.style.display = "none";
                } catch (err) {
                    console.error("Microphone access denied or failed:", err);
                    alert(
                        "Could not access microphone. Please check your browser permissions.",
                    );
                }
            });
        </script>
    </body>
</html>
