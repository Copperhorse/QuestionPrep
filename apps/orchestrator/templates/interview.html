<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interview Session — QuestionPrep</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/styles.css" />

        <!-- ONNX Runtime — must load before stress-detector.js -->
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    </head>
    <body>
        <!-- ── Navigation ── -->
        <nav class="site-nav">
            <div class="container">
                <a href="/" class="nav-brand">QuestionPrep</a>
                <div class="nav-links">
                    <span
                        style="
                            font-size: 0.88rem;
                            color: var(--ink-very-light);
                            font-style: italic;
                            font-family: &quot;Lora&quot;, serif;
                        "
                        >Live Practice Session</span
                    >
                    <button id="end-session-btn" class="btn btn-outline btn-sm">
                        <i data-lucide="x-circle"></i> End Session
                    </button>
                </div>
            </div>
        </nav>

        <!-- ── Main ── -->
        <section class="page-section">
            <div class="container" style="max-width: 860px">
                <!-- Page header -->
                <div
                    style="
                        margin-bottom: 1.5rem;
                        padding-bottom: 1.5rem;
                        border-bottom: 1px solid var(--border);
                    "
                >
                    <h1 style="font-size: clamp(1.6rem, 4vw, 2.2rem)">
                        Live Practice Session
                    </h1>
                    <p class="page-subtitle">
                        Take your time. Speak clearly. There is no rush here.
                    </p>
                </div>

                <!-- Chat window -->
                <div class="chat-container" id="chat-container">
                    <!-- Populated dynamically by interview.js -->
                    <div
                        style="
                            text-align: center;
                            color: var(--ink-very-light);
                            font-style: italic;
                            font-family: &quot;Lora&quot;, serif;
                            padding: 2rem;
                        "
                    >
                        Connecting to session…
                    </div>
                </div>

                <!-- Stress banner -->
                <div id="stress-banner"></div>
                <div id="stress-details"></div>

                <!-- Audio visualizer -->
                <div
                    class="visualizer-wrapper"
                    id="visualizer-container"
                    style="margin-top: 1rem"
                >
                    <span class="visualizer-prompt" id="mic-prompt"
                        >Click "Start Mic" to speak</span
                    >
                </div>

                <!-- Playback -->
                <audio
                    id="audio-playback"
                    controls
                    style="
                        display: none;
                        width: 100%;
                        border-radius: 6px;
                        outline: none;
                        margin-top: 0.75rem;
                    "
                ></audio>

                <!-- Input area -->
                <div class="input-area" style="margin-top: 1rem">
                    <button
                        type="button"
                        id="mic-btn"
                        class="btn btn-outline"
                        style="white-space: nowrap; flex-shrink: 0"
                    >
                        <i data-lucide="mic"></i> Start Mic
                    </button>
                    <textarea
                        class="form-control"
                        id="answer-text"
                        rows="2"
                        placeholder="Type your answer or speak…"
                        style="resize: none; flex: 1"
                    ></textarea>
                    <!-- chat-form wraps the submit so interview.js can attach its event -->
                    <form id="chat-form" style="display: contents">
                        <button
                            type="submit"
                            class="btn btn-primary"
                            style="flex-shrink: 0; padding: 0 1.8rem"
                        >
                            <i data-lucide="send"></i> Send
                        </button>
                    </form>
                </div>

                <!-- End session note -->
                <p
                    style="
                        margin-top: 1rem;
                        font-size: 0.82rem;
                        color: var(--ink-very-light);
                        text-align: center;
                        font-style: italic;
                        font-family: &quot;Lora&quot;, serif;
                    "
                >
                    Your answers are saved automatically. You can end the
                    session at any time.
                </p>
            </div>
        </section>

        <!-- Session logic — must load before the module script below -->
        <script src="/static/js/interview.js"></script>

        <!-- Stress detector (browser global) -->
        <script src="/static/js/stress-detector.js"></script>

        <!-- Mic visualizer + stress analysis pipeline (ES module) -->
        <script type="module">
            import AudioMotionAnalyzer from "https://unpkg.com/audiomotion-analyzer?module";

            // ── DOM refs ──────────────────────────────────────────────────────
            const container = document.getElementById("visualizer-container");
            const micBtn = document.getElementById("mic-btn");
            const micPrompt = document.getElementById("mic-prompt");
            const audioPlayback = document.getElementById("audio-playback");
            const stressBanner = document.getElementById("stress-banner");
            const stressDetails = document.getElementById("stress-details");
            const answerText = document.getElementById("answer-text");

            // ── State ─────────────────────────────────────────────────────────
            let audioMotion = null;
            let micStream = null;
            let mediaRecorder = null;
            let audioChunks = [];

            // ── Stress detector — load models in background ───────────────────
            let detector = null;
            if (window.StressDetector) {
                detector = new window.StressDetector({
                    xgboost: "/static/models/xgboost.onnx",
                    randomForest: "/static/models/random_forest.onnx",
                    logisticRegression:
                        "/static/models/logistic_regression.onnx",
                });
                detector.load().catch((err) => {
                    console.warn(
                        "[StressDetector] Model load failed — stress analysis disabled.",
                        err,
                    );
                    detector = null;
                });
            }

            // ── Visualizer ────────────────────────────────────────────────────
            function initVisualizer() {
                audioMotion = new AudioMotionAnalyzer(container, {
                    source: null,
                    height: 120,
                    mode: 3,
                    barSpace: 0.4,
                    ledBars: false,
                    lumiBars: false,
                    radial: false,
                    showScaleX: false,
                    showScaleY: false,
                    bgAlpha: 0,
                    overlay: true,
                    gradient: "classic",
                    minDecibels: -70,
                    smoothing: 0.7,
                });
                audioMotion.registerGradient("warm", {
                    bgColor: "transparent",
                    colorStops: [
                        { pos: 0, color: "#b1682e" },
                        { pos: 0.5, color: "#c97f3e" },
                        { pos: 1, color: "#dfa56f" },
                    ],
                });
                audioMotion.setOptions({ gradient: "warm" });
                audioMotion.disconnectOutput();
            }

            // ── Stress UI ─────────────────────────────────────────────────────
            const STRESS_MESSAGES = {
                not_stressed: "You sound calm and composed. Keep going.",
                mild: "Slight hesitation detected. Take a breath before continuing.",
                stressed:
                    "You sound a little stressed. Try slowing down and speaking clearly.",
                highly_stressed:
                    "High stress detected. Pause, breathe, and speak at a steady pace.",
                analyzing: "Analysing your response…",
            };

            function showStressBanner(level, details = null) {
                stressBanner.className = level;
                stressBanner.textContent = STRESS_MESSAGES[level] || level;
                stressBanner.style.display = "block";

                if (details && level !== "analyzing") {
                    stressDetails.innerHTML = `
            <span class="stress-pill">Probability: ${(details.probability * 100).toFixed(0)}%</span>
            <span class="stress-pill">XGB: ${(details.modelScores.xgboost * 100).toFixed(0)}%</span>
            <span class="stress-pill">RF: ${(details.modelScores.randomForest * 100).toFixed(0)}%</span>
            <span class="stress-pill">LR: ${(details.modelScores.logisticRegression * 100).toFixed(0)}%</span>
            ${details.stutterFlag ? '<span class="stress-pill">Disfluency detected</span>' : ""}
          `;
                    stressDetails.style.display = "flex";
                } else {
                    stressDetails.style.display = "none";
                }
            }

            function hideStressBanner() {
                stressBanner.style.display = "none";
                stressDetails.style.display = "none";
            }

            // ── Decode webm blob → Float32Array at 16kHz ──────────────────────
            async function blobToFloat32(blob) {
                const arrayBuffer = await blob.arrayBuffer();
                const audioCtx = new AudioContext({ sampleRate: 16000 });
                const decoded = await audioCtx.decodeAudioData(arrayBuffer);
                await audioCtx.close();
                return decoded.getChannelData(0);
            }

            // ── Server STT + disfluency ───────────────────────────────────────
            async function analyzeOnServer(blob) {
                try {
                    const formData = new FormData();
                    formData.append("audio", blob, "recording.webm");
                    const res = await fetch("/api/analyze-speech", {
                        method: "POST",
                        body: formData,
                    });
                    if (!res.ok) throw new Error(`Server error ${res.status}`);
                    return await res.json();
                } catch (err) {
                    console.warn("[Server STT] Failed:", err);
                    return { stutter_flag: false, transcript: "" };
                }
            }

            // ── Main analysis pipeline ────────────────────────────────────────
            async function runAnalysis(audioBlob) {
                if (!detector) return;
                showStressBanner("analyzing");

                try {
                    const [float32Audio, serverResult] = await Promise.all([
                        blobToFloat32(audioBlob),
                        analyzeOnServer(audioBlob),
                    ]);

                    if (serverResult.transcript) {
                        answerText.value = serverResult.transcript;
                    }

                    const stressResult = await detector.predict(
                        float32Audio,
                        serverResult.stutter_flag || false,
                    );
                    showStressBanner(stressResult.level, {
                        probability: stressResult.probability,
                        modelScores: stressResult.modelScores,
                        stutterFlag: serverResult.stutter_flag,
                    });
                } catch (err) {
                    console.error("[Analysis] Failed:", err);
                    hideStressBanner();
                }
            }

            // ── Mic button ────────────────────────────────────────────────────
            micBtn.addEventListener("click", async () => {
                if (!audioMotion) initVisualizer();

                if (micStream) {
                    // TOGGLE OFF
                    if (mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }
                    micStream.getTracks().forEach((track) => track.stop());
                    audioMotion.disconnectInput();
                    micStream = null;

                    micBtn.innerHTML = '<i data-lucide="mic"></i> Start Mic';
                    micBtn.classList.remove("btn-danger");
                    micBtn.classList.add("btn-outline");
                    micPrompt.style.display = "block";
                    lucide.createIcons();
                    return;
                }

                // TOGGLE ON
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            noiseSuppression: true,
                            echoCancellation: true,
                            autoGainControl: false,
                        },
                        video: false,
                    });

                    const micNode =
                        audioMotion.audioCtx.createMediaStreamSource(micStream);
                    audioMotion.connectInput(micNode);

                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(micStream);

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, {
                            type: "audio/webm",
                        });
                        audioPlayback.src = URL.createObjectURL(audioBlob);
                        audioPlayback.style.display = "block";
                        await runAnalysis(audioBlob);
                    };

                    mediaRecorder.start();
                    audioPlayback.style.display = "none";
                    hideStressBanner();

                    micBtn.innerHTML = '<i data-lucide="square"></i> Stop Mic';
                    micBtn.classList.remove("btn-outline");
                    micBtn.classList.add("btn-danger");
                    micPrompt.style.display = "none";
                    lucide.createIcons();
                } catch (err) {
                    console.error("Microphone access denied or failed:", err);
                    alert(
                        "Could not access microphone. Please check your browser permissions.",
                    );
                }
            });
        </script>

        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
        <script>
            lucide.createIcons();
        </script>
    </body>
</html>
