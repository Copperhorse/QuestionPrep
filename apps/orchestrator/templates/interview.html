<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interview Session - QuestionPrep</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="static/css/styles.css"" />
    </head>
    <body style="background-color: var(--pink-mist)">
        <section style="padding: 40px 0">
            <div class="container">
                <div
                    style="
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 20px;
                    "
                >
                    <h2 style="margin: 0; text-align: left">
                        Live Practice Session
                    </h2>
                    <button
                        class="cta-button"
                        style="
                            background-color: var(--pastel-rose);
                            border: none;
                            padding: 10px 20px;
                        "
                    >
                        End Session
                    </button>
                </div>

                <div class="chat-container">
                    <div class="message msg-ai">
                        <strong>Interviewer:</strong><br />
                        Can you explain the difference between a process and a
                        thread in an operating system?
                    </div>
                </div>

                <div style="max-width: 800px; margin: 0 auto">
                    <div class="visualizer-wrapper" id="visualizer-container">
                        <span class="visualizer-prompt" id="mic-prompt"
                            >Click "Start Mic" to speak</span
                        >
                    </div>
                </div>

                <div style="max-width: 800px; margin: 0 auto">
                    <form class="input-area" id="chat-form">
                        <button
                            type="button"
                            id="mic-btn"
                            class="cta-button"
                            style="
                                background-color: var(--soft-lime);
                                color: var(--soft-charcoal);
                                border: none;
                                cursor: pointer;
                            "
                        >
                            🎙️ Start Mic
                        </button>
                        <textarea
                            class="form-control"
                            rows="2"
                            placeholder="Type your answer or speak..."
                            style="resize: none"
                        ></textarea>
                        <button
                            type="submit"
                            class="cta-button"
                            style="
                                border: none;
                                cursor: pointer;
                                padding: 0 40px;
                            "
                        >
                            Send
                        </button>
                    </form>
                </div>
            </div>
            <div style="max-width: 800px; margin: 0 auto">
                <div class="visualizer-wrapper" id="visualizer-container">
                    <span class="visualizer-prompt" id="mic-prompt"
                        >Click "Start Mic" to speak</span
                    >
                </div>

                <div style="margin-top: 15px">
                    <audio
                        id="audio-playback"
                        controls
                        style="
                            display: none;
                            width: 100%;
                            border-radius: 20px;
                            outline: none;
                        "
                    ></audio>
                </div>
            </div>
        </section>

        <script type="module">
            import AudioMotionAnalyzer from "https://unpkg.com/audiomotion-analyzer?module";

            const container = document.getElementById("visualizer-container");
            const micBtn = document.getElementById("mic-btn");
            const micPrompt = document.getElementById("mic-prompt");
            const audioPlayback = document.getElementById("audio-playback"); // The new player

            let audioMotion = null;
            let micStream = null;

            // NEW: Variables to hold the recorded audio data
            let mediaRecorder = null;
            let audioChunks = [];

            function initVisualizer() {
                audioMotion = new AudioMotionAnalyzer(container, {
                    source: null,
                    height: 120,
                    mode: 3,
                    barSpace: 0.4,
                    ledBars: false,
                    lumiBars: false,
                    radial: false,
                    showScaleX: false,
                    showScaleY: false,
                    bgAlpha: 0,
                    overlay: true,
                    gradient: "classic",
                    minDecibels: -70,
                    smoothing: 0.7,
                });

                audioMotion.registerGradient("pastel", {
                    bgColor: "transparent",
                    colorStops: [
                        { pos: 0, color: "#93C5FD" },
                        { pos: 0.5, color: "#C7D2FE" },
                        { pos: 1, color: "#FBCFE8" },
                    ],
                });
                audioMotion.setOptions({ gradient: "pastel" });
                audioMotion.disconnectOutput(); // Prevents the live feedback screech
            }

            // Handle Microphone Access
            micBtn.addEventListener("click", async () => {
                if (!audioMotion) {
                    initVisualizer();
                }

                // TOGGLE MIC OFF
                if (micStream) {
                    // 1. Stop the recorder
                    if (mediaRecorder && mediaRecorder.state !== "inactive") {
                        mediaRecorder.stop();
                    }

                    // 2. Shut down the mic hardware
                    micStream.getTracks().forEach((track) => track.stop());
                    audioMotion.disconnectInput();
                    micStream = null;

                    // 3. Reset UI
                    micBtn.innerText = "🎙️ Start Mic";
                    micBtn.style.backgroundColor = "var(--soft-lime)";
                    micPrompt.style.display = "block";
                    return;
                }

                // TOGGLE MIC ON
                try {
                    const audioConstraints = {
                        audio: {
                            noiseSuppression: true,
                            echoCancellation: true,
                            autoGainControl: false,
                        },
                        video: false,
                    };

                    micStream =
                        await navigator.mediaDevices.getUserMedia(
                            audioConstraints,
                        );

                    const audioCtx = audioMotion.audioCtx;
                    const micNode = audioCtx.createMediaStreamSource(micStream);
                    audioMotion.connectInput(micNode);

                    // --- NEW: SETUP THE RECORDER ---
                    audioChunks = []; // Clear old recordings
                    mediaRecorder = new MediaRecorder(micStream);

                    // As audio comes in, push it to our array
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    // When the mic stops, build the audio file and put it in the player
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, {
                            type: "audio/webm",
                        });
                        const audioUrl = URL.createObjectURL(audioBlob);

                        audioPlayback.src = audioUrl;
                        audioPlayback.style.display = "block"; // Reveal the player
                    };

                    // Start recording!
                    mediaRecorder.start();
                    audioPlayback.style.display = "none"; // Hide the player while speaking

                    // Update UI
                    micBtn.innerText = "🛑 Stop Mic";
                    micBtn.style.backgroundColor = "var(--pastel-rose)";
                    micPrompt.style.display = "none";
                } catch (err) {
                    console.error("Microphone access denied or failed:", err);
                    alert(
                        "Could not access microphone. Please check your browser permissions.",
                    );
                }
            });
        </script>
    </body>
</html>
